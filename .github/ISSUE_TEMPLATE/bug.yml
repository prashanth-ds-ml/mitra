name: Bug report
description: Something broke or gave a wrong result
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What you typed and what happened
      description: Copy the terminal (the CodeMitra header too, it shows the model and version). Remove anything private.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: input
    id: version
    attributes:
      label: CodeMitra version and machine
      description: "`codemitra --version`, OS, GPU / RAM, model"
      placeholder: "codemitra 0.8.0, macOS 15, M2 16 GB, qwen3.5:4b"
    validations:
      required: true
